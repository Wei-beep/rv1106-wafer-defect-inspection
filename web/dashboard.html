<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wafer Defect Inspection Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0f1117; color: #e0e0e0; padding: 20px;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
  }
  .header h1 { font-size: 22px; color: #fff; }
  .header .status { font-size: 14px; }
  .status-dot {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle;
  }
  .status-online { background: #4caf50; box-shadow: 0 0 8px #4caf50; }
  .status-offline { background: #f44336; }
  .lang-btn {
    background: #1e2130; color: #e0e0e0; border: 1px solid #333;
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .lang-btn:hover { background: #2a2d40; }
  .cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px; margin-bottom: 20px;
  }
  .card {
    background: #1a1d29; border: 1px solid #2a2d40; border-radius: 10px;
    padding: 14px 16px;
  }
  .card .label { font-size: 12px; color: #888; margin-bottom: 6px; }
  .card .value { font-size: 22px; font-weight: 600; color: #fff; }
  .card .unit { font-size: 13px; color: #888; font-weight: 400; margin-left: 3px; }
  .stream-box {
    background: #1a1d29; border: 1px solid #2a2d40; border-radius: 10px;
    padding: 16px; max-height: 60vh; overflow-y: auto;
  }
  .stream-box h2 { font-size: 16px; margin-bottom: 12px; color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; padding: 8px 10px; color: #888; font-weight: 500;
    border-bottom: 1px solid #2a2d40; position: sticky; top: 0; background: #1a1d29;
  }
  td { padding: 7px 10px; border-bottom: 1px solid #1e2130; }
  tr:hover { background: #1e2130; }
  .low-conf { color: #f44336; font-weight: 600; }
  .cls-tag {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    background: #2a2d40; font-size: 12px;
  }
  .reconnect-tip {
    display: none; background: #3e2723; border: 1px solid #f44336;
    color: #ffab91; padding: 10px 16px; border-radius: 8px; margin-bottom: 16px;
  }
</style>
</head>
<body>

<div class="header">
  <h1 id="title">晶圆缺陷检测实时看板</h1>
  <div>
    <span class="status"><span class="status-dot status-offline" id="statusDot"></span><span id="statusText">未连接</span></span>
    <button class="lang-btn" onclick="toggleLang()" id="langBtn">EN</button>
  </div>
</div>

<div class="reconnect-tip" id="reconnectTip">SSE 连接断开，正在自动重连…</div>

<div class="cards">
  <div class="card"><div class="label" data-i18n="device">设备状态</div><div class="value" id="cardDevice">-</div></div>
  <div class="card"><div class="label" data-i18n="runtime">运行时长</div><div class="value" id="cardRuntime">-</div></div>
  <div class="card"><div class="label" data-i18n="total">累计推理</div><div class="value" id="cardTotal">0</div></div>
  <div class="card"><div class="label" data-i18n="processed">已处理文件</div><div class="value" id="cardProcessed">0</div></div>
  <div class="card"><div class="label" data-i18n="npu">NPU 时延</div><div class="value" id="cardNpu">-<span class="unit">ms</span></div></div>
  <div class="card"><div class="label" data-i18n="fps">吞吐量</div><div class="value" id="cardFps">-<span class="unit">fps</span></div></div>
  <div class="card"><div class="label" data-i18n="latest">最近判定</div><div class="value" id="cardLatest" style="font-size:16px;">-</div></div>
  <div class="card"><div class="label" data-i18n="source">输入源</div><div class="value" id="cardSource" style="font-size:14px;">-</div></div>
</div>

<div class="stream-box">
  <h2 id="streamTitle">实时推理流</h2>
  <table>
    <thead>
      <tr>
        <th data-i18n="time">时间</th>
        <th data-i18n="file">文件名</th>
        <th data-i18n="class">类别</th>
        <th data-i18n="conf">置信度</th>
        <th data-i18n="second">次选</th>
        <th data-i18n="npuMs">NPU(ms)</th>
      </tr>
    </thead>
    <tbody id="streamBody"></tbody>
  </table>
</div>

<script>
const I18N = {
  zh: {
    title: "晶圆缺陷检测实时看板",
    device: "设备状态", runtime: "运行时长", total: "累计推理",
    processed: "已处理文件", npu: "NPU 时延", fps: "吞吐量",
    latest: "最近判定", source: "输入源",
    time: "时间", file: "文件名", class: "类别",
    conf: "置信度", second: "次选", npuMs: "NPU(ms)",
    streamTitle: "实时推理流",
    online: "已连接", offline: "未连接",
    reconnect: "SSE 连接断开，正在自动重连…"
  },
  en: {
    title: "Wafer Defect Inspection Dashboard",
    device: "Device", runtime: "Uptime", total: "Total Inference",
    processed: "Files Processed", npu: "NPU Latency", fps: "Throughput",
    latest: "Latest Result", source: "Input Source",
    time: "Time", file: "File", class: "Class",
    conf: "Confidence", second: "2nd Choice", npuMs: "NPU(ms)",
    streamTitle: "Real-time Inference Stream",
    online: "Connected", offline: "Disconnected",
    reconnect: "SSE disconnected, reconnecting…"
  }
};
let lang = "zh";

function toggleLang() {
  lang = (lang === "zh") ? "en" : "zh";
  document.getElementById("langBtn").textContent = (lang === "zh") ? "EN" : "中";
  document.getElementById("title").textContent = I18N[lang].title;
  document.getElementById("streamTitle").textContent = I18N[lang].streamTitle;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = I18N[lang][el.dataset.i18n];
  });
  document.getElementById("reconnectTip").textContent = I18N[lang].reconnect;
}

let evtSource = null;
let totalCount = 0;

function connectSSE() {
  const proto = location.protocol === "https:" ? "https" : "http";
  const url = proto + "://" + location.host + "/api/stream";
  evtSource = new EventSource(url);

  evtSource.onopen = () => {
    document.getElementById("statusDot").className = "status-dot status-online";
    document.getElementById("statusText").textContent = I18N[lang].online;
    document.getElementById("reconnectTip").style.display = "none";
    document.getElementById("cardDevice").textContent = "RV1106";
  };

  evtSource.onmessage = (e) => {
    try {
      const d = JSON.parse(e.data);
      if (d.type === "infer") {
        totalCount++;
        document.getElementById("cardTotal").textContent = totalCount;
        document.getElementById("cardNpu").innerHTML =
          (d.npu_ms || "-") + '<span class="unit">ms</span>';
        document.getElementById("cardLatest").textContent = d.pred || "-";
        document.getElementById("cardSource").textContent = d.source || "-";
        if (d.processed) document.getElementById("cardProcessed").textContent = d.processed;
        addRow(d);
      } else if (d.type === "status") {
        if (d.uptime) document.getElementById("cardRuntime").textContent = d.uptime;
        if (d.total) document.getElementById("cardTotal").textContent = d.total;
        if (d.processed) document.getElementById("cardProcessed").textContent = d.processed;
        if (d.fps) document.getElementById("cardFps").innerHTML =
          d.fps + '<span class="unit">fps</span>';
      }
    } catch (err) { console.warn("parse error", err); }
  };

  evtSource.onerror = () => {
    document.getElementById("statusDot").className = "status-dot status-offline";
    document.getElementById("statusText").textContent = I18N[lang].offline;
    document.getElementById("reconnectTip").style.display = "block";
  };
}

function addRow(d) {
  const tbody = document.getElementById("streamBody");
  const tr = document.createElement("tr");
  const now = new Date().toLocaleTimeString();
  const confLow = (d.conf !== undefined && d.conf < 0.50);
  tr.innerHTML =
    "<td>" + now + "</td>" +
    "<td>" + (d.file || "-") + "</td>" +
    "<td><span class='cls-tag'>" + (d.pred || "-") + "</span></td>" +
    "<td class='" + (confLow ? "low-conf" : "") + "'>" +
      (d.conf !== undefined ? Number(d.conf).toFixed(3) : "-") + "</td>" +
    "<td>" + (d.second || "-") + "</td>" +
    "<td>" + (d.npu_ms || "-") + "</td>";
  tbody.insertBefore(tr, tbody.firstChild);
  while (tbody.rows.length > 200) tbody.deleteRow(tbody.rows.length - 1);
}

// 每5秒请求一次设备状态
setInterval(() => {
  fetch("/api/device/status").then(r => r.json()).then(d => {
    if (d.uptime) document.getElementById("cardRuntime").textContent = d.uptime;
    if (d.total) document.getElementById("cardTotal").textContent = d.total;
  }).catch(() => {});
}, 5000);

connectSSE();
</script>
</body>
</html>
